name: Build Road Data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download detailed New Bern cartography
        run: |
          python3 - <<'PYCODE'
          import json, urllib.parse, urllib.request
          bbox='35.095,-77.063,35.123,-77.025'
          query=f'''[out:json][timeout:90];(way["highway"]({bbox});way["waterway"]({bbox});way["natural"="water"]({bbox});way["landuse"~"grass|forest|meadow|recreation_ground|cemetery"]({bbox});way["leisure"~"park|garden|pitch"]({bbox});way["building"]({bbox}););out geom;'''
          hosts=['https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']
          errors=[]
          for server in hosts:
              try:
                  data=urllib.parse.urlencode({'data':query}).encode()
                  req=urllib.request.Request(server,data=data,headers={'User-Agent':'RoadWise-Educational-Prototype/1.0 (github.com/MWheelis/roadwise-nc)','Content-Type':'application/x-www-form-urlencoded'})
                  with urllib.request.urlopen(req,timeout=115) as res: payload=json.load(res)
                  if len(payload.get('elements',[]))<50:raise RuntimeError('Not enough geographic features returned')
                  break
              except Exception as e:errors.append(f'{server}: {e}')
          else:raise RuntimeError('; '.join(errors))
          features=[];named=[]
          for way in payload['elements']:
              tags=way.get('tags',{});geom=way.get('geometry') or []
              if len(geom)<2:continue
              coords=[[n['lat'],n['lon']] for n in geom]
              closed=bool(way.get('nodes') and way['nodes'][0]==way['nodes'][-1])
              if tags.get('highway'):
                  kind='roads';subtype=tags['highway'];closed=False
                  if tags.get('name'):named.append(way)
              elif tags.get('natural')=='water' or tags.get('waterway'):
                  kind='water';subtype=tags.get('waterway','water')
              elif tags.get('building'):
                  kind='buildings';subtype='building'
              elif tags.get('landuse') or tags.get('leisure'):
                  kind='green';subtype=tags.get('landuse',tags.get('leisure'))
              else:continue
              features.append({'kind':kind,'subtype':subtype,'coords':coords,'polygon':closed})
          with open('map-background.json','w') as f:json.dump({'features':features,'attribution':'© OpenStreetMap contributors (ODbL)'},f,separators=(',',':'))
          with open('roads.json','w') as f:json.dump({'elements':named},f,separators=(',',':'))
          print('Features',len(features),'named road segments',len(named))
          PYCODE
      - name: Commit mapped data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add map-background.json roads.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update New Bern road and cartographic layers'
            git push
          fi
